[workspace]
members = [
    "sim_core",
    "domains",
    "engine_v3",
    "services/sim-wasm",
    "services/sim-mirror",
    "services/sim-profiler",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"          
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "deny"
rust_2018_idioms = "deny"

[workspace.dependencies]
sim_core   = { path = "sim_core" }
domains    = { path = "domains" }
engine_v3  = { path = "engine_v3" }
dyn-clone = "1.0.20"
rand = "0.9.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
typetag = "0.2.20"
uuid = { version = "1.18.0", features = ["serde", "v4", "v5", "rng-getrandom"] }
thiserror = "2.0.15"
toml = "0.9.5"
serde_with = "3.14.0"
chrono = { version = "0.4.41", features = ["serde"] }
parking_lot = "0.12.1"
tokio = { version = "1.46.1", features = ["rt-multi-thread", "time", "macros", "signal", "sync"] }
axum = { version = "0.8", features = ["macros", "ws"] }
tower-http = { version = "0.6", features = ["cors"] }
rust_decimal = { version = "1.37.0", features = ["serde", "maths"] }
rust_decimal_macros = "1.37"
petgraph = "0.8.2"
ahash = { version = "0.8", features = ["serde"] }
smallvec = "1.13"
rayon = "1.10"
metrics = "0.21"
metrics-exporter-prometheus = "0.11"
simd-json = { version = "0.13", features = ["serde"] }
tracing = "0.1.38"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
web-time = "0.2"
[profile.dev]
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
debug = false
