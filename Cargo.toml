[workspace]
members = [
    "crates/sim_core",
    "crates/domains",
    "crates/sim_macros",
    "crates/engine",
]
resolver = "3"

[workspace.dependencies]
# Core Rust ecosystem
dyn-clone = "1.0.20"
rand = "0.9.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
typetag = "0.2.20"
uuid = { version = "1.18.0", features = ["serde", "v4", "v5"] }
thiserror = "2.0.15"
once_cell = "1.21.3"
toml = "0.9.5"

ndarray = "0.15.0"
serde_with = "3.14.0"

chrono = { version = "0.4.41", features = ["serde"] }

sscanf = "0.4.3"

tokio = { version = "1.46.1", features = ["rt-multi-thread", "time", "macros", "signal"] }
axum = { version = "0.8", features = ["macros", "ws"] }
tower-http = { version = "0.6", features = ["cors"] }

crossbeam-channel = "0.5.15"

fake = { version = "4.4.0", features = ["derive"] }

proc-macro2 = "1.0.101"
quote = "1.0"
syn = "2.0.106"

bevy = { version = "0.16", default-features = false, features = [
    "bevy_app",
    "bevy_core",
    "bevy_ecs",
    "bevy_time",
] }