[[recipes]]
id = "wheat_farming"
name = "Wheat Farming"
inputs = []
outputs = [{ good_id = "wheat", quantity = 50.0 }]
labour_hours = 8.0

[[recipes]]
id = "bread_baking"
name = "Bread Baking"
inputs = [{ good_id = "wheat", quantity = 5.0 }]
outputs = [{ good_id = "bread", quantity = 20.0 }]
labour_hours = 0.5

# --- Primary Extraction ---

[[recipes]]
id = "iron_mining"
name = "Iron Ore Mining"
inputs = []
outputs = [{ good_id = "iron_ore", quantity = 2.0 }]
labour_hours = 12.0

[[recipes]]
id = "copper_mining"
name = "Copper Ore Mining"
inputs = []
outputs = [{ good_id = "copper_ore", quantity = 1.5 }]
labour_hours = 10.0

[[recipes]]
id = "oil_drilling"
name = "Crude Oil Drilling"
inputs = []
outputs = [{ good_id = "oil", quantity = 10.0 }]
labour_hours = 20.0

# --- Intermediate Good Production ---

[[recipes]]
id = "steel_smelting"
name = "Steel Smelting"
inputs = [{ good_id = "iron_ore", quantity = 1.2 }]
outputs = [{ good_id = "steel", quantity = 1.0 }]
labour_hours = 6.0

[[recipes]]
id = "oil_refining"
name = "Oil Refining"
inputs = [{ good_id = "oil", quantity = 1.0 }]
outputs = [
    { good_id = "petroleum", quantity = 0.4 },
    { good_id = "plastic", quantity = 0.3 },
    { good_id = "diesel", quantity = 0.3 }
]
labour_hours = 4.0

[[recipes]]
id = "semiconductor_fabrication"
name = "Semiconductor Fabrication"
inputs = [
    { good_id = "copper_ore", quantity = 0.05 },
    { good_id = "plastic", quantity = 0.01 }
]
outputs = [{ good_id = "semiconductors", quantity = 100.0 }]
labour_hours = 25.0

# --- Consumer Good Production ---

[[recipes]]
id = "toy_manufacturing"
name = "Toy Manufacturing"
inputs = [{ good_id = "plastic", quantity = 0.1 }]
outputs = [{ good_id = "toys", quantity = 5.0 }]
labour_hours = 1.0

[[recipes]]
id = "electronics_assembly"
name = "Electronics Assembly"
inputs = [
    { good_id = "semiconductors", quantity = 10.0 },
    { good_id = "plastic", quantity = 0.5 },
    { good_id = "steel", quantity = 0.2 }
]
outputs = [{ good_id = "electronics", quantity = 1.0 }]
labour_hours = 8.0

[[recipes]]
id = "car_manufacturing"
name = "Car Manufacturing"
inputs = [
    { good_id = "steel", quantity = 1.5 },
    { good_id = "plastic", quantity = 0.3 },
    { good_id = "electronics", quantity = 1.0 },
    { good_id = "semiconductors", quantity = 50.0 }
]
outputs = [{ good_id = "car", quantity = 1.0 }]
labour_hours = 150.0

# --- Banks ---

[[banks]]
id = "bank_a"
name = "Community Savings Bank"
initial_assets = [
  # Primary govvies via seed sale → issuance + DvP (requires patch)
  { type = "Bond", tenor = "T2Y", quantity = 2_500 },
  { type = "Bond", tenor = "T1Y", quantity = 2_300 },
  { type = "Bond", tenor = "T5Y", quantity = 1_500 },  # ≈ $8.5m
  { type = "Bond", tenor = "T10Y", quantity = 1_100 }  # ≈ $5m
]

initial_liabilities = [] # No initial liabilities
reserves = { type = "ratio_of_liabilities", min_ratio = 0.10, max_ratio = 0.12 }

[[banks]]
id="bank_b"
name="First National Bank"
initial_assets = [
  { type = "Bond", tenor = "T30Y", quantity = 5_500 },
  { type = "Bond", tenor = "T10Y", quantity = 3_200 },
  { type = "Bond", tenor = "T5Y", quantity = 2_800 },
  { type = "Bond", tenor = "T2Y", quantity = 2_000 }  # ≈ $15m
]
initial_liabilities = [] # No initial liabilities
reserves = { type = "ratio_of_liabilities", min_ratio = 0.10, max_ratio = 0.12 }

# --- Firms ---

[[firms]]
id = "alpha_mfg"
name = "Alpha Manufacturing Co."
bank_id = "bank_a"
initial_assets = [
  { type = "Deposit", bank_id = "bank_a", amount = 2_500_000.0 }, # working cash
]
initial_liabilities = [] # No initial liabilities
decision_model = { type = "ProductionFirm" }

# Beta Retail parks proceeds at bank_a
[[firms]]
id = "beta_retail"
name = "Beta Retail Group"
bank_id = "bank_a"  # 'home' bank for operating deposits (so deposits will hit bank_a)
initial_assets = [
  { type = "Deposit", bank_id = "bank_a", amount = 3_000_000.0 }
]
initial_liabilities = [] # No initial liabilities
decision_model = { type = "ProductionFirm" }

[[firms]]
id = "goldman_stanley"
name = "Goldman Stanley"
bank_id = "bank_b"
initial_assets = [
  { type = "Deposit", bank_id = "bank_b", amount = 5_000_000.0 },
  { type = "Bond", tenor = "T1M", quantity = 2_000 },  # ≈ $5m
  { type = "Bond", tenor = "T3M", quantity = 1_500 },   # ≈ $4m
  { type = "Bond", tenor = "T6M", quantity = 1_000 },   # ≈ $3m
  { type = "Bond", tenor = "T2Y", quantity = 800 }    # ≈ $2.5m
]
initial_liabilities = [] # No initial liabilities
decision_model = { type = "InvestmentFirm", min_liquidity = 1_000_000.0, quote_qty = 50.0 }
# --- Firm Groups ---

[[firm_groups]]
id_prefix = "wheat_farm_"
count = 1
bank_mix = { bank_a = 0.3, bank_b = 0.7 }
recipe_name = "wheat_farming"
deposit = { type = "log_normal", mu = 10.5, sigma = 0.8 }
inventory = { good_slug = "wheat", quantity = { type = "pareto", xm = 100.0, alpha = 1.5 }, unit_cost = 5.0 }
desired_markup = { dist = { type = "normal", mean = 0.15, stdev = 0.05 }, clamp = { min = 0.05, max = 0.30 } }
decision_model = { type = "ProductionFirm" }

[[firm_groups]]
id_prefix = "bakery_"
count = 2
bank_mix = { bank_a = 0.5, bank_b = 0.5 }
recipe_name = "bread_baking"
deposit = { type = "log_normal", mu = 9.5, sigma = 1.0 }
inventory = { good_slug = "bread", quantity = { type = "pareto", xm = 100.0, alpha = 2.0 }, unit_cost = 6.0 }
desired_markup = { dist = { type = "normal", mean = 0.30, stdev = 0.08 }, clamp = { min = 0.15, max = 0.50 } }
decision_model = { type = "ProductionFirm" }

# --- Consumer Groups ---

[[consumer_groups]]
id_prefix="HH"
count=5
bank_mix = { bank_a = 0.5, bank_b = 0.5 }
income = { type = "normal", mean = 60_000.0, stdev = 10_000.0 }
deposit = { type = "pct_of_income", pct = 0.10 }
consumption_basket = { bread = 0.1, electronics = 0.05, diesel = 0.02, car = 0.005, toys = 0.03 }

[[consumer_groups]]
id_prefix = "mortgage_holders"
count = 10
bank_mix = { bank_a = 0.8, bank_b = 0.2 }
income = { type = "log_normal", mu = 12.0, sigma = 0.5 } # Higher income
deposit = { type = "pct_of_income", pct = 0.05 }
consumption_basket = { bread = 0.05, electronics = 0.1, car = 0.01, diesel = 0.05 }
initial_liabilities = [
    { type = "Mortgage", creditor_id = "bank_a", principal = { type = "normal", mean = 750000.0, stdev = 150000.0}, rate_bps = 650, maturity_days = 10950 }
]

[[consumer_groups]]
id_prefix = "credit_card_users"
count = 5
bank_mix = { bank_a = 0.4, bank_b = 0.6 }
income = { type = "normal", mean = 75000.0, stdev = 15000.0 }
deposit = { type = "pct_of_income", pct = 0.08 }
consumption_basket = { bread = 0.15, electronics = 0.08, toys = 0.05, diesel = 0.03 }
initial_liabilities = [
    { type = "CreditCard", creditor_id = "bank_b", principal = { type = "log_normal", mu = 8.0, sigma = 0.7 }, rate_bps = 2100, maturity_days = 3650 }
]
