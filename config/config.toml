# --- Simulation v3 Configuration File ---

name = "Basic Economy"
description = "A simple setup with 2 banks, 3 firms, and 5 consumers for engine_v3."

# General simulation settings
[config]
iterations = 100 # The simulation will run for 100 ticks (days)

# --- Goods & Production Recipes ---
# Define the raw materials and finished goods available in the economy.

[[goods]]
id = "raw_material"
name = "Raw Material"
unit = "unit"
category = "RawMaterial"
cpi_weight = 0.0 # Raw materials don't directly contribute to CPI

[[goods]]
id = "general_good"
name = "General Purpose Good"
unit = "item"
category = "ConsumerGood"
cpi_weight = 1.0 # This is the only consumer good, so it has 100% CPI weight

# Define how goods are produced.
[[recipes]]
id = "basic_manufacturing_recipe"
name = "Basic Manufacturing"
inputs = [
  { good_id = "raw_material", quantity = 2.0 }
]
outputs = [
  { good_id = "general_good", quantity = 1.0 }
]
labour_hours = 8.0

# --- Banks ---
# Define the banks in the economy. Their initial liabilities (deposits) will be
# created automatically when firms and consumers are given deposit assets.

[[banks]]
id = "bank_a"
name = "Bank A"
initial_assets = [
  { type = "Reserves", amount = 1_000_000.0 },
]
initial_liabilities = []

[[banks]]
id = "bank_b"
name = "Bank B"
initial_assets = [
  { type = "Reserves", amount = 500_000.0 }
]
initial_liabilities = []


# --- Firms ---
# Define the firms. We have two production firms and one investment firm.

[[firms]]
id = "producer_1"
name = "General Goods Inc."
bank_id = "bank_a" # This firm banks with Bank A
recipe_name = "Basic Manufacturing" # It knows how to produce goods
initial_assets = [
  { type = "Deposit", bank_id = "bank_a", amount = 100_000.0 },
  { type = "Inventory", good_slug = "raw_material", quantity = 50.0, unit_cost = 10.0 }
]
decision_model = { type = "ProductionFirm" }

[[firms]]
id = "producer_2"
name = "Reliable Wares Co."
bank_id = "bank_b"
recipe_name = "Basic Manufacturing"
initial_assets = [
  { type = "Deposit", bank_id = "bank_b", amount = 75_000.0 },
  { type = "Inventory", good_slug = "raw_material", quantity = 20.0, unit_cost = 10.0 }
]
decision_model = { type = "ProductionFirm" }

[[firms]]
id = "investment_firm_1"
name = "Capital Investments"
bank_id = "bank_a"
initial_assets = [
  { type = "Deposit", bank_id = "bank_a", amount = 2_000_000.0 }
]
# This firm uses the InvestmentFirm decision model to trade financial assets
decision_model = { type = "InvestmentFirm", min_liquidity = 50000.0, quote_qty = 10.0 }


# --- Consumers ---
# Define the 5 consumers who will work, earn, and spend.

[[consumers]]
id = "consumer_1"
bank_id = "bank_a"
income = 50000.0 # Annual income
initial_assets = [
  { type = "Deposit", bank_id = "bank_a", amount = 5000.0 }
]
initial_liabilities = []
consumption_basket = { general_good = 1.0 } # 100% of their budget goes to the only good

[[consumers]]
id = "consumer_2"
bank_id = "bank_a"
income = 65000.0
initial_assets = [
  { type = "Deposit", bank_id = "bank_a", amount = 8000.0 }
]
initial_liabilities = []
consumption_basket = { general_good = 1.0 }

[[consumers]]
id = "consumer_3"
bank_id = "bank_b"
income = 80000.0
initial_assets = [
  { type = "Deposit", bank_id = "bank_b", amount = 12000.0 }
]
initial_liabilities = []
consumption_basket = { general_good = 1.0 }

[[consumers]]
id = "consumer_4"
bank_id = "bank_b"
income = 45000.0
initial_assets = [
  { type = "Deposit", bank_id = "bank_b", amount = 2000.0 }
]
initial_liabilities = []
consumption_basket = { general_good = 1.0 }

[[consumers]]
id = "consumer_5"
bank_id = "bank_a"
income = 120000.0
initial_assets = [
  { type = "Deposit", bank_id = "bank_a", amount = 25000.0 }
]
initial_liabilities = []
consumption_basket = { general_good = 1.0 }