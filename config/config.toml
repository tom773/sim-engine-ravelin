name = "Base Scenario"
description = "A simple economy with two banks, one oil refinery, and a few consumers."

[config]
iterations = 100
treasury_tenors_to_register = ["T2Y", "T5Y", "T10Y", "T30Y"]

[[banks]]
id = "bank_a"
name = "Ravelin National Bank"
initial_assets = [
    { type = "Reserves", amount = 500000.0 },
    { type = "Cash", amount = 200000.0 },
    { type = "Bond", tenor = "T10Y", quantity = 500 },
    { type = "Bond", tenor = "T30Y", quantity = 200 },
    { type = "Bond", tenor = "T5Y", quantity = 300 },
    { type = "Bond", tenor = "T2Y", quantity = 400 }
]
initial_liabilities = []

[[banks]]
id = "bank_b"
name = "Economic Sim Savings & Loan"
initial_assets = [
    { type = "Reserves", amount = 300000.0 },
    { type = "Cash", amount = 150000.0 },
    { type = "Bond", tenor = "T2Y", quantity = 200 },
    { type = "Bond", tenor = "T5Y", quantity = 300 },
    { type = "Bond", tenor = "T10Y", quantity = 150 },
    { type = "Bond", tenor = "T30Y", quantity = 100 }
]
initial_liabilities = []

[[firms]]
id = "global_oil"
name = "Global Oil Corp"
bank_id = "bank_a"
recipe_name = "Oil Refining"
initial_assets = [
    { type = "Deposit", bank_id = "bank_a", amount = 250000.0 },
    { type = "Inventory", good_slug = "oil", quantity = 1000.0, unit_cost = 50.0 }
]
initial_liabilities = []

[[firms]]
id = "bread_petrol_yum"
name = "Bread & Petrol Co."
bank_id = "bank_b"
recipe_name = "Bread Production"
initial_assets = [
    { type = "Deposit", bank_id = "bank_b", amount = 150000.0 },
    { type = "Inventory", good_slug = "bread", quantity = 500.0, unit_cost = 2.0 },
    { type = "Inventory", good_slug = "petrol", quantity = 300.0, unit_cost = 3.0 }
]
initial_liabilities = []

[[consumers]]
id = "consumer_1"
bank_id = "bank_a"
income = 60000.0 # Annual
initial_assets = [
    { type = "Deposit", bank_id = "bank_a", amount = 5000.0 },
    { type = "Cash", amount = 200.0 }
]
initial_liabilities = []

[[consumers]]
id = "consumer_2"
bank_id = "bank_b"
income = 85000.0 # Annual
