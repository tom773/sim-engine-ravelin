[package]
name = "sim-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
sim-mirror = { path = "../services/sim-mirror", default-features = false }
engine_v3 = { path = "../engine_v3", default-features = false }
sim_core = { path = "../sim_core", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
chrono = { workspace = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
serde-wasm-bindgen = "0.6"
rand = { workspace = true }
rmp-serde = "1.3"
console_error_panic_hook = { version = "0.1", optional = true }
arrow = "56.2.0"

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]

# Leave hooks for future JSON bridging without forcing them in the hello world build.
js = ["serde_json", "wasm-bindgen-futures"]
serde_json = ["dep:serde_json"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
